spring.datasource.url=jdbc:h2:mem:fieldops_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

fieldops.storage.evidence-dir=./target/test-evidences
fieldops.storage.max-file-size-bytes=10485760
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB


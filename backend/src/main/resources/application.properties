spring.application.name=field-ops-backend
server.address=0.0.0.0
server.port=${PORT:8080}

# PostgreSQL Datasource (Configurável via variáveis de ambiente)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fieldops}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Segurança JWT (Segredos injetados via ambiente em produção - DoD 18.4 / 11.10)
fieldops.security.jwt.secret=${JWT_SECRET:FieldOpsDefaultSecureHmacSha256SecretKeyForDevAndTestEnv2026!}
fieldops.security.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
fieldops.security.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Padronização de erros RFC 7807 sem exposição de stack trace (RT-02 / AC-SECURITY)
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never

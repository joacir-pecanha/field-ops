spring.application.name=field-ops-backend
server.address=0.0.0.0
server.port=${PORT:8080}

# PostgreSQL Datasource (Configurável via variáveis de ambiente - Local Docker ou AWS RDS)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fieldops}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:15}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway (Migrações V1..V6 + Seed idempotente R__demo_seed_data.sql)
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:6}

# Segurança JWT (Segredos injetados via ambiente em produção - DoD 18.4 / 11.10)
fieldops.security.jwt.secret=${JWT_SECRET:FieldOpsDefaultSecureHmacSha256SecretKeyForDevAndTestEnv2026!}
fieldops.security.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
fieldops.security.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
fieldops.security.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,https://*.sslip.io}

# Padronização de erros RFC 7807 sem exposição de stack trace (RT-02 / AC-SECURITY)
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never

# OpenAPI / Swagger UI (TASK-008 Passo 2 - Validação humana de endpoints)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.filter=true

# Armazenamento de evidências fotográficas e limites multipart (TASK-018)
fieldops.storage.evidence-dir=${EVIDENCE_STORAGE_DIR:./data/evidences}
fieldops.storage.max-file-size-bytes=${EVIDENCE_MAX_FILE_SIZE_BYTES:10485760}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
